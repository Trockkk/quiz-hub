name: Deploy multiplayer server (Cloudflare)

# Optional: redeploys the Cloudflare Worker when the game rules or content change.
# Requires the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; skipped otherwise.
on:
  push:
    branches: [main]
    paths: ['quiz-hub/server/**', 'quiz-hub/src/core/**', 'quiz-hub/src/content/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret: deploy the server manually (see quiz-hub/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
      - name: Test the shared game rules
        if: steps.creds.outputs.ok == 'true'
        working-directory: quiz-hub
        run: npm ci && npm test
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        working-directory: quiz-hub/server
        run: npm ci && npx tsc --noEmit && npx wrangler deploy
